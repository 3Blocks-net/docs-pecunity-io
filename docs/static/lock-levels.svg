<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="llbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF1FB"/>
      <stop offset="100%" stop-color="#DDE3F7"/>
    </linearGradient>
    <filter id="lls">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A3FBA" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="800" height="280" rx="16" fill="url(#llbg)"/>
  <text x="400" y="35" text-anchor="middle" fill="#1E2A4A" font-size="18" font-weight="700">$PEC Lock Levels</text>

  <!-- Basic -->
  <rect x="15" y="55" width="145" height="210" rx="12" fill="white" filter="url(#lls)"/>
  <rect x="15" y="55" width="145" height="40" rx="12" fill="#CFD1FF"/>
  <rect x="15" y="80" width="145" height="15" fill="#CFD1FF"/>
  <text x="87" y="80" text-anchor="middle" fill="#1E2A4A" font-size="15" font-weight="700">Basic</text>
  <text x="87" y="120" text-anchor="middle" fill="#1A3FBA" font-size="20" font-weight="700">500</text>
  <text x="87" y="138" text-anchor="middle" fill="#6B7280" font-size="11">$PEC required</text>
  <line x1="35" y1="150" x2="140" y2="150" stroke="#EEF1FB" stroke-width="1"/>
  <text x="87" y="172" text-anchor="middle" fill="#1E2A4A" font-size="13" font-weight="600">5% fee off</text>
  <text x="87" y="195" text-anchor="middle" fill="#6B7280" font-size="11">No multiplier</text>

  <!-- Bronze -->
  <rect x="170" y="55" width="145" height="210" rx="12" fill="white" filter="url(#lls)"/>
  <rect x="170" y="55" width="145" height="40" rx="12" fill="#A4BDFA"/>
  <rect x="170" y="80" width="145" height="15" fill="#A4BDFA"/>
  <text x="242" y="80" text-anchor="middle" fill="#1E2A4A" font-size="15" font-weight="700">Bronze</text>
  <text x="242" y="120" text-anchor="middle" fill="#1A3FBA" font-size="20" font-weight="700">2,500</text>
  <text x="242" y="138" text-anchor="middle" fill="#6B7280" font-size="11">$PEC required</text>
  <line x1="190" y1="150" x2="295" y2="150" stroke="#EEF1FB" stroke-width="1"/>
  <text x="242" y="172" text-anchor="middle" fill="#1E2A4A" font-size="13" font-weight="600">7.5% fee off</text>
  <text x="242" y="195" text-anchor="middle" fill="#4568D0" font-size="11">1.5x multiplier</text>

  <!-- Silver -->
  <rect x="325" y="55" width="145" height="210" rx="12" fill="white" filter="url(#lls)"/>
  <rect x="325" y="55" width="145" height="40" rx="12" fill="#81A1EE"/>
  <rect x="325" y="80" width="145" height="15" fill="#81A1EE"/>
  <text x="397" y="80" text-anchor="middle" fill="white" font-size="15" font-weight="700">Silver</text>
  <text x="397" y="120" text-anchor="middle" fill="#1A3FBA" font-size="20" font-weight="700">5,000</text>
  <text x="397" y="138" text-anchor="middle" fill="#6B7280" font-size="11">$PEC required</text>
  <line x1="345" y1="150" x2="450" y2="150" stroke="#EEF1FB" stroke-width="1"/>
  <text x="397" y="172" text-anchor="middle" fill="#1E2A4A" font-size="13" font-weight="600">10% fee off</text>
  <text x="397" y="195" text-anchor="middle" fill="#4568D0" font-size="11">2x multiplier</text>

  <!-- Gold -->
  <rect x="480" y="55" width="145" height="210" rx="12" fill="white" filter="url(#lls)"/>
  <rect x="480" y="55" width="145" height="40" rx="12" fill="#4568D0"/>
  <rect x="480" y="80" width="145" height="15" fill="#4568D0"/>
  <text x="552" y="80" text-anchor="middle" fill="white" font-size="15" font-weight="700">Gold</text>
  <text x="552" y="120" text-anchor="middle" fill="#1A3FBA" font-size="20" font-weight="700">30,000</text>
  <text x="552" y="138" text-anchor="middle" fill="#6B7280" font-size="11">$PEC required</text>
  <line x1="500" y1="150" x2="605" y2="150" stroke="#EEF1FB" stroke-width="1"/>
  <text x="552" y="172" text-anchor="middle" fill="#1E2A4A" font-size="13" font-weight="600">15% fee off</text>
  <text x="552" y="195" text-anchor="middle" fill="#4568D0" font-size="11">2.5x multiplier</text>
  <text x="552" y="215" text-anchor="middle" fill="#1A3FBA" font-size="10" font-weight="600">Club + Early Access</text>

  <!-- Diamond -->
  <rect x="635" y="55" width="150" height="210" rx="12" fill="#1A3FBA" filter="url(#lls)"/>
  <rect x="635" y="55" width="150" height="40" rx="12" fill="#0F2B80"/>
  <rect x="635" y="80" width="150" height="15" fill="#0F2B80"/>
  <text x="710" y="80" text-anchor="middle" fill="white" font-size="15" font-weight="700">Diamond</text>
  <text x="710" y="120" text-anchor="middle" fill="white" font-size="20" font-weight="700">125,000</text>
  <text x="710" y="138" text-anchor="middle" fill="#A4BDFA" font-size="11">$PEC required</text>
  <line x1="655" y1="150" x2="765" y2="150" stroke="#4568D0" stroke-width="1"/>
  <text x="710" y="172" text-anchor="middle" fill="white" font-size="13" font-weight="600">25% fee off</text>
  <text x="710" y="195" text-anchor="middle" fill="#A4BDFA" font-size="11">4x multiplier</text>
  <text x="710" y="215" text-anchor="middle" fill="#CFD1FF" font-size="10" font-weight="600">Club + Early Access</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 160" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="sibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF1FB"/>
      <stop offset="100%" stop-color="#DDE3F7"/>
    </linearGradient>
    <filter id="sis">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A3FBA" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="650" height="160" rx="16" fill="url(#sibg)"/>

  <!-- Email -->
  <rect x="20" y="20" width="145" height="120" rx="12" fill="white" filter="url(#sis)"/>
  <circle cx="92" cy="55" r="20" fill="#1A3FBA"/>
  <text x="92" y="61" text-anchor="middle" fill="white" font-size="18">@</text>
  <text x="92" y="90" text-anchor="middle" fill="#1E2A4A" font-size="14" font-weight="600">Email</text>
  <text x="92" y="108" text-anchor="middle" fill="#6B7280" font-size="10">One-time code</text>
  <text x="92" y="122" text-anchor="middle" fill="#6B7280" font-size="10">No password needed</text>

  <!-- Google -->
  <rect x="180" y="20" width="145" height="120" rx="12" fill="white" filter="url(#sis)"/>
  <circle cx="252" cy="55" r="20" fill="#4568D0"/>
  <text x="252" y="61" text-anchor="middle" fill="white" font-size="18" font-weight="bold">G</text>
  <text x="252" y="90" text-anchor="middle" fill="#1E2A4A" font-size="14" font-weight="600">Google</text>
  <text x="252" y="108" text-anchor="middle" fill="#6B7280" font-size="10">One-click login</text>
  <text x="252" y="122" text-anchor="middle" fill="#6B7280" font-size="10">with your account</text>

  <!-- Facebook -->
  <rect x="340" y="20" width="145" height="120" rx="12" fill="white" filter="url(#sis)"/>
  <circle cx="412" cy="55" r="20" fill="#81A1EE"/>
  <text x="412" y="62" text-anchor="middle" fill="white" font-size="20" font-weight="bold">f</text>
  <text x="412" y="90" text-anchor="middle" fill="#1E2A4A" font-size="14" font-weight="600">Facebook</text>
  <text x="412" y="108" text-anchor="middle" fill="#6B7280" font-size="10">Social login</text>
  <text x="412" y="122" text-anchor="middle" fill="#6B7280" font-size="10">quick access</text>

  <!-- Passkey -->
  <rect x="500" y="20" width="130" height="120" rx="12" fill="white" filter="url(#sis)"/>
  <circle cx="565" cy="55" r="20" fill="#A4BDFA"/>
  <text x="565" y="62" text-anchor="middle" fill="#1E2A4A" font-size="18">🔑</text>
  <text x="565" y="90" text-anchor="middle" fill="#1E2A4A" font-size="14" font-weight="600">Passkey</text>
  <text x="565" y="108" text-anchor="middle" fill="#6B7280" font-size="10">Biometric login</text>
  <text x="565" y="122" text-anchor="middle" fill="#6B7280" font-size="10">Face ID / fingerprint</text>
</svg>

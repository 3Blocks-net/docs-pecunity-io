<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF1FB"/>
      <stop offset="100%" stop-color="#DDE3F7"/>
    </linearGradient>
    <filter id="rs">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A3FBA" flood-opacity="0.1"/>
    </filter>
    <marker id="rarrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#81A1EE"/>
    </marker>
  </defs>
  <rect width="700" height="200" rx="16" fill="url(#rbg)"/>

  <!-- Step 1 -->
  <rect x="20" y="40" width="150" height="120" rx="12" fill="white" filter="url(#rs)"/>
  <circle cx="95" cy="75" r="18" fill="#1A3FBA"/>
  <text x="95" y="80" text-anchor="middle" fill="white" font-size="16" font-weight="bold">1</text>
  <text x="95" y="108" text-anchor="middle" fill="#1E2A4A" font-size="13" font-weight="600">Get Your Code</text>
  <text x="95" y="126" text-anchor="middle" fill="#6B7280" font-size="10">Unique PEC-XXXXX</text>
  <text x="95" y="140" text-anchor="middle" fill="#6B7280" font-size="10">referral code</text>

  <path d="M175 100 L200 100" stroke="#81A1EE" stroke-width="2" fill="none" marker-end="url(#rarrow)"/>

  <!-- Step 2 -->
  <rect x="205" y="40" width="150" height="120" rx="12" fill="white" filter="url(#rs)"/>
  <circle cx="280" cy="75" r="18" fill="#4568D0"/>
  <text x="280" y="80" text-anchor="middle" fill="white" font-size="16" font-weight="bold">2</text>
  <text x="280" y="108" text-anchor="middle" fill="#1E2A4A" font-size="13" font-weight="600">Share It</text>
  <text x="280" y="126" text-anchor="middle" fill="#6B7280" font-size="10">Friends sign up</text>
  <text x="280" y="140" text-anchor="middle" fill="#6B7280" font-size="10">with your code</text>

  <path d="M360 100 L385 100" stroke="#81A1EE" stroke-width="2" fill="none" marker-end="url(#rarrow)"/>

  <!-- Step 3 -->
  <rect x="390" y="40" width="150" height="120" rx="12" fill="white" filter="url(#rs)"/>
  <circle cx="465" cy="75" r="18" fill="#81A1EE"/>
  <text x="465" y="80" text-anchor="middle" fill="white" font-size="16" font-weight="bold">3</text>
  <text x="465" y="108" text-anchor="middle" fill="#1E2A4A" font-size="13" font-weight="600">They Use Pecunity</text>
  <text x="465" y="126" text-anchor="middle" fill="#6B7280" font-size="10">Active strategies</text>
  <text x="465" y="140" text-anchor="middle" fill="#6B7280" font-size="10">generate fees</text>

  <path d="M545 100 L570 100" stroke="#81A1EE" stroke-width="2" fill="none" marker-end="url(#rarrow)"/>

  <!-- Step 4 -->
  <rect x="575" y="40" width="105" height="120" rx="12" fill="#1A3FBA" filter="url(#rs)"/>
  <circle cx="627" cy="75" r="18" fill="white"/>
  <text x="627" y="80" text-anchor="middle" fill="#1A3FBA" font-size="16" font-weight="bold">4</text>
  <text x="627" y="108" text-anchor="middle" fill="white" font-size="13" font-weight="600">You Earn</text>
  <text x="627" y="126" text-anchor="middle" fill="#A4BDFA" font-size="10">$PEC + USDT</text>
  <text x="627" y="140" text-anchor="middle" fill="#A4BDFA" font-size="10">rewards</text>
</svg>

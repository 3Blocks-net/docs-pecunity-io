<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="sabg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF1FB"/>
      <stop offset="100%" stop-color="#DDE3F7"/>
    </linearGradient>
    <filter id="sas">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A3FBA" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="600" height="350" rx="16" fill="url(#sabg)"/>
  <text x="300" y="35" text-anchor="middle" fill="#1E2A4A" font-size="18" font-weight="700">Your Security Layers</text>

  <!-- Layer 1: You -->
  <rect x="150" y="55" width="300" height="55" rx="12" fill="#1A3FBA" filter="url(#sas)"/>
  <text x="300" y="80" text-anchor="middle" fill="white" font-size="15" font-weight="700">You</text>
  <text x="300" y="98" text-anchor="middle" fill="#A4BDFA" font-size="11">Google, Email, Facebook, or Passkey</text>

  <!-- Arrow -->
  <text x="300" y="125" text-anchor="middle" fill="#81A1EE" font-size="16">▼</text>

  <!-- Layer 2: MFA -->
  <rect x="120" y="135" width="360" height="55" rx="12" fill="#4568D0" filter="url(#sas)"/>
  <text x="300" y="160" text-anchor="middle" fill="white" font-size="15" font-weight="700">Multi-Factor Authentication</text>
  <text x="300" y="178" text-anchor="middle" fill="#CFD1FF" font-size="11">Optional extra verification layer</text>

  <!-- Arrow -->
  <text x="300" y="205" text-anchor="middle" fill="#81A1EE" font-size="16">▼</text>

  <!-- Layer 3: Smart Account -->
  <rect x="90" y="215" width="420" height="55" rx="12" fill="#81A1EE" filter="url(#sas)"/>
  <text x="300" y="240" text-anchor="middle" fill="white" font-size="15" font-weight="700">Smart Contract Account (ERC-4337)</text>
  <text x="300" y="258" text-anchor="middle" fill="white" font-size="11">Upgradeable, recoverable, gas-sponsored</text>

  <!-- Arrow -->
  <text x="300" y="285" text-anchor="middle" fill="#81A1EE" font-size="16">▼</text>

  <!-- Layer 4: Blockchain -->
  <rect x="60" y="295" width="480" height="42" rx="12" fill="#CFD1FF" filter="url(#sas)"/>
  <text x="300" y="322" text-anchor="middle" fill="#1E2A4A" font-size="14" font-weight="600">BNB Smart Chain — Audited by Cyfrin</text>
</svg>

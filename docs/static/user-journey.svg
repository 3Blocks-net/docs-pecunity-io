<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF1FB"/>
      <stop offset="100%" stop-color="#DDE3F7"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A3FBA" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="800" height="180" rx="16" fill="url(#bg)"/>

  <!-- Step 1 -->
  <rect x="20" y="30" width="160" height="120" rx="12" fill="white" filter="url(#shadow)"/>
  <circle cx="100" cy="65" r="18" fill="#1A3FBA"/>
  <text x="100" y="70" text-anchor="middle" fill="white" font-size="16" font-weight="bold">1</text>
  <text x="100" y="100" text-anchor="middle" fill="#1E2A4A" font-size="14" font-weight="600">Sign Up</text>
  <text x="100" y="118" text-anchor="middle" fill="#6B7280" font-size="11">Google, Email</text>
  <text x="100" y="132" text-anchor="middle" fill="#6B7280" font-size="11">or Passkey</text>

  <!-- Arrow 1 -->
  <path d="M185 90 L210 90" stroke="#81A1EE" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Step 2 -->
  <rect x="215" y="30" width="160" height="120" rx="12" fill="white" filter="url(#shadow)"/>
  <circle cx="295" cy="65" r="18" fill="#4568D0"/>
  <text x="295" y="70" text-anchor="middle" fill="white" font-size="16" font-weight="bold">2</text>
  <text x="295" y="100" text-anchor="middle" fill="#1E2A4A" font-size="14" font-weight="600">Fund Account</text>
  <text x="295" y="118" text-anchor="middle" fill="#6B7280" font-size="11">Buy crypto or</text>
  <text x="295" y="132" text-anchor="middle" fill="#6B7280" font-size="11">transfer tokens</text>

  <!-- Arrow 2 -->
  <path d="M380 90 L405 90" stroke="#81A1EE" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Step 3 -->
  <rect x="410" y="30" width="160" height="120" rx="12" fill="white" filter="url(#shadow)"/>
  <circle cx="490" cy="65" r="18" fill="#81A1EE"/>
  <text x="490" y="70" text-anchor="middle" fill="white" font-size="16" font-weight="bold">3</text>
  <text x="490" y="100" text-anchor="middle" fill="#1E2A4A" font-size="14" font-weight="600">Pick a Strategy</text>
  <text x="490" y="118" text-anchor="middle" fill="#6B7280" font-size="11">Browse catalog</text>
  <text x="490" y="132" text-anchor="middle" fill="#6B7280" font-size="11">and configure</text>

  <!-- Arrow 3 -->
  <path d="M575 90 L600 90" stroke="#81A1EE" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Step 4 -->
  <rect x="605" y="30" width="170" height="120" rx="12" fill="#1A3FBA" filter="url(#shadow)"/>
  <circle cx="690" cy="65" r="18" fill="white"/>
  <text x="690" y="70" text-anchor="middle" fill="#1A3FBA" font-size="16" font-weight="bold">4</text>
  <text x="690" y="100" text-anchor="middle" fill="white" font-size="14" font-weight="600">Earn Yield</text>
  <text x="690" y="118" text-anchor="middle" fill="#A4BDFA" font-size="11">Automated DeFi</text>
  <text x="690" y="132" text-anchor="middle" fill="#A4BDFA" font-size="11">strategies work for you</text>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#81A1EE"/>
    </marker>
  </defs>
</svg>
